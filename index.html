<!DOCTYPE html>
<html>
<head>
    <title>Ludo Board - Perfect Grid</title>

    <table border="1" cellspacing="0" cellpadding="20">
        <!-- Row 1 -->
        <tr>
            <!-- Green Home (6x6) -->
            <td rowspan="6" colspan="6" bgcolor="green" align="center" valign="middle">
                <b>GREEN HOME</b>
            </td>
            
            <!-- Top Path (1 cell wide) -->
            <td></td>
            <td></td>
            <td></td>
            
            <!-- Yellow Home (6x6) -->
            <td rowspan="6" colspan="6" bgcolor="yellow" align="center" valign="middle">
                <b>YELLOW HOME</b>
            </td>
        </tr>

        <!-- Row 2 -->
        <tr>
            <td></td>
            <td bgcolor="yellow"></td> <!-- Yellow path: 1 cell -->
            <td bgcolor="yellow"></td>
        </tr>

        <!-- Row 3 -->
        <tr>
            <td bgcolor="green"></td>
            <td bgcolor="yellow"></td> <!-- Yellow path: 1 cell -->
            <td></td>
        </tr>

        <!-- Row 4 -->

            <td></td> <!-- Green path: 1 cell -->

            <td></td>

            <td></td>
            <td></td>
            <td></td>
            <td></td>
            
            <!-- Center Home (3x3) -->
            <td rowspan="3" colspan="3" bgcolor="orange" align="center" valign="middle">
                <b>HOME</b>
            </td>
            
            <td></td>
            <td></td>
            <td></td> <!-- Yellow path: 1 cell -->
            <td bgcolor="yellow"></td>
            <td></td>
            <td></td>
        </tr>

        <!-- Row 8 (Middle) -->

            <td></td>
            <td bgcolor="green"></td> <!-- Green path: 1 cell -->
            <td bgcolor="green"></td>
            <td bgcolor="green"></td>
            <td bgcolor="green"></td>
            <td bgcolor="green"></td>
            
            <!-- Center spans here -->
            
            <td bgcolor="blue"></td>

            <td bgcolor="blue"></td>
            <td bgcolor="blue"></td>
            <td></td>

        <tr>
            <td></td>
            <td></td>
            <td bgcolor="red"></td>
            <td></td> <!-- Red path: 1 cell -->
            <td></td>
            <td></td>
            
            <!-- Center spans here -->
            
            <td></td>
            <td></td> <!-- Blue path: 1 cell -->
            <td></td>
            <td></td>
            <td bgcolor="blue"></td>
            <td></td>
        </tr>

        <!-- Row 10 -->
        <tr>
            <!-- Red Home (6x6) -->
            <td rowspan="6" colspan="6" bgcolor="red" align="center" valign="middle">
                <b>RED HOME</b>
            </td>
            
            <!-- Bottom Path (1 cell wide) -->
            <td></td>
            <td bgcolor="red"></td> <!-- Red path: 1 cell -->
            <td></td>
            
            <!-- Blue Home (6x6) -->
            <td rowspan="6" colspan="6" bgcolor="blue" align="center" valign="middle">
